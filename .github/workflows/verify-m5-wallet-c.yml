name: M5 wallet C transaction verifier (one-time, read only)
on:
  pull_request:
    paths:
      - '.github/workflows/verify-m5-wallet-c.yml'
      - 'scripts/verify-m5-wallet-c.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-m5-wallet-c.mjs
