name: M6 real wallet rotation proof
on:
  pull_request:
    paths:
      - '.github/workflows/verify-m6-rotation.yml'
      - 'scripts/verify-m6-rotation.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-m6-rotation.mjs
