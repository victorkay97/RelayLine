name: RelayLine validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Offline policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # SDK adapter tests import the installed Arkiv SDK, but require no wallet.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo:offline
      - run: npm run demo:judge
  web-build:
    name: Publisher and reader production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run build:reader
      - run: test -f dist/index.html && test -f dist/recover.html
      - run: test -f dist-reader/index.html && test -f dist-reader/recover.html
      - run: test ! -f dist-reader/publisher.html
      - run: npm ls @arkiv-network/sdk viem vite --depth=0
      - uses: actions/upload-artifact@v4
        with:
          name: relayline-static-pages
          path: |
            dist/
            dist-reader/
          retention-days: 7
  hosted-smoke:
    name: Public deployment HTTP checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run smoke:hosted
      - run: npm run smoke:m4
  ux-browser:
    name: Responsive UX, journeys and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ux-browser-debug
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  tiramisu-read-only:
    name: Read-only Tiramisu connectivity
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run probe:rpc
      - run: npm run probe:query
      - run: npm run probe:friction
      # Real M4 fixtures expire and the deliberate outage is temporary; rerun
      # scripts/verify-m4-publication.mjs and scripts/verify-m4-recovery.mjs
      # explicitly when validating their respective conditions.
      # Never store funded wallets as CI secrets or auto-publish on every PR.
