name: M6 successor pre-rotation live check
on:
  pull_request:
    paths:
      - '.github/workflows/verify-m6-successor.yml'
      - 'scripts/verify-m6-successor.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-m6-successor.mjs
